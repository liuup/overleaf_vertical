name: Build Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create build directory
      run: mkdir -p build
      
    - name: Copy extension files
      run: |
        cp manifest.json build/
        cp content.js build/
        cp background.js build/
        cp options.html build/
        cp options.js build/
        cp icon.png build/
        
    - name: Get version from manifest
      id: get_version
      run: |
        VERSION=$(grep -oP '"version":\s*"\K[^"]+' manifest.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extension version: $VERSION"
    
    - name: Create and push tag
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      run: |
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -f v${{ steps.get_version.outputs.version }}
        git push -f origin v${{ steps.get_version.outputs.version }}
        
    - name: Create ZIP archive
      run: |
        cd build
        zip -r ../overleaf-vertical-v${{ steps.get_version.outputs.version }}.zip .
        cd ..

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: overleaf-vertical-v${{ steps.get_version.outputs.version }}
        path: build/*
        retention-days: 90

    - name: Create Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v1
      with:
        tag_name: v${{ steps.get_version.outputs.version }}
        files: overleaf-vertical-v${{ steps.get_version.outputs.version }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

