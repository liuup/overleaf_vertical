name: Build Extension

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create build directory
      run: mkdir -p build
      
    - name: Copy extension files
      run: |
        cp manifest.json build/
        cp content.js build/
        cp background.js build/
        cp options.html build/
        cp options.js build/
        cp icon.png build/
        
    - name: Get version from manifest
      id: get_version
      run: |
        VERSION=$(grep -oP '"version":\s*"\K[^"]+' manifest.json)
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "Extension version: $VERSION"
        
    - name: Create ZIP archive
      if: startsWith(github.ref, 'refs/tags/v')
      run: |
        cd build
        zip -r ../overleaf-vertical-v${{ steps.get_version.outputs.version }}.zip .
        cd ..

    - name: Upload build artifact
      uses: actions/upload-artifact@v4
      with:
        name: overleaf-vertical-v${{ steps.get_version.outputs.version }}
        path: build/*
        retention-days: 90

    - name: Create Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v1
      with:
        files: overleaf-vertical-v${{ steps.get_version.outputs.version }}.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

